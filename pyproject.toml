[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orb"
version = "0.1.0"
description = "A local gateway and device protocol for the Agent Orb desktop AI interface"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-orb = "orb_gateway.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orb_gateway = ["static/*"]
